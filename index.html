o compare results.", "jp": "その方法によって結果を比較できる。"}, {"id": "c085", "en": "population", "kana": "ポピュレイション", "meaning": "人口（動物なら個体数）", "example": "The animal population declined.", "jp": "その動物の個体数は減少した。"}, {"id": "c086", "en": "within", "kana": "ウィズィン", "meaning": "～以内に", "example": "Most changes happened within a year.", "jp": "ほとんどの変化は1年以内に起こった。"}, {"id": "c087", "en": "on average", "kana": "オン アヴェリッジ", "meaning": "平均して", "example": "People walked 5 km on average.", "jp": "人々は平均して5km歩いた。"}, {"id": "c088", "en": "over time", "kana": "オウヴァー タイム", "meaning": "時間とともに", "example": "The result changed over time.", "jp": "結果は時間とともに変化した。"}, {"id": "c089", "en": "at least", "kana": "アット リースト", "meaning": "少なくとも", "example": "At least 20 people joined the study.", "jp": "少なくとも20人が研究に参加した。"}, {"id": "c090", "en": "more than", "kana": "モア ザン", "meaning": "～を超える", "example": "More than 100 people answered.", "jp": "100人を超える人が答えた。"}, {"id": "c091", "en": "less than", "kana": "レス ザン", "meaning": "～未満", "example": "Less than half chose A.", "jp": "半数未満がAを選んだ。"}, {"id": "c092", "en": "risk", "kana": "リスク", "meaning": "危険性", "example": "The risk increased with age.", "jp": "年齢とともに危険が増した。"}, {"id": "c093", "en": "external", "kana": "イクスターナル", "meaning": "外部の", "example": "They focused on external sounds.", "jp": "彼らは外部の音に集中した。"}, {"id": "c094", "en": "internal", "kana": "インターナル", "meaning": "内部の", "example": "They focused on internal movements.", "jp": "彼らは身体内部の動きに集中した。"}, {"id": "c095", "en": "movement", "kana": "ムーヴメント", "meaning": "動き", "example": "The movement was slow.", "jp": "その動きはゆっくりだった。"}, {"id": "c096", "en": "infection", "kana": "インフェクション", "meaning": "感染", "example": "The animals died from infection.", "jp": "その動物たちは感染で死んだ。"}];
const STORAGE_KEY="kokkaCore96_srs_v1", SETTINGS_KEY="kokkaCore96_settings_v1";
const DAY_MS=86400000, TEN_MIN_MS=600000, INTERVALS=[1,3,7,14,30,60,90];
let state=loadState(), settings=loadSettings(), current=null, revealed=false, forceQueue=[];
const $=id=>document.getElementById(id);
function todayKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function defaultCardState(){return{seen:false,step:-1,interval:0,due:0,last:0,reps:0,lapses:0,lastRating:"",introducedDate:""}}
function loadState(){try{const r=localStorage.getItem(STORAGE_KEY),p=r?JSON.parse(r):{cards:{},daily:{}};p.cards=p.cards||{};p.daily=p.daily||{};return p}catch(e){return{cards:{},daily:{}}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function loadSettings(){try{const r=localStorage.getItem(SETTINGS_KEY),s=r?JSON.parse(r):{};return{dailyNew:Number.isFinite(+s.dailyNew)?+s.dailyNew:10,showKana:s.showKana!==false}}catch(e){return{dailyNew:10,showKana:true}}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function getCS(id){if(!state.cards[id])state.cards[id]=defaultCardState();return state.cards[id]}
function getDaily(){const k=todayKey();if(!state.daily[k])state.daily[k]={introduced:0};return state.daily[k]}
function dueCards(now=Date.now()){return CARDS.filter(c=>{const s=getCS(c.id);return s.seen&&s.due<=now}).sort((a,b)=>getCS(a.id).due-getCS(b.id).due)}
function remainingNewToday(){return Math.max(0,settings.dailyNew-getDaily().introduced)}
function unseenCards(){return CARDS.filter(c=>!getCS(c.id).seen)}
function chooseNext(){if(forceQueue.length)return forceQueue.shift();const due=dueCards();if(due.length)return due[0];if(remainingNewToday()>0){const u=unseenCards();if(u.length)return u[0]}return null}
function introduceIfNeeded(card){const s=getCS(card.id);if(!s.seen){s.seen=true;s.introducedDate=todayKey();s.due=Date.now();getDaily().introduced+=1;saveState()}}
function renderStats(){const learned=CARDS.filter(c=>getCS(c.id).seen).length,mature=CARDS.filter(c=>getCS(c.id).seen&&getCS(c.id).interval>=30).length;$("dueCount").textContent=dueCards().length;$("newCount").textContent=Math.min(remainingNewToday(),unseenCards().length);$("learnedCount").textContent=learned;$("matureCount").textContent=mature}
function nextDueText(){const f=CARDS.map(c=>getCS(c.id)).filter(s=>s.seen&&s.due>Date.now()).sort((a,b)=>a.due-b.due);if(!f.length)return"";const d=f[0].due-Date.now();if(d<3600000)return"次の復習まで約 "+Math.max(1,Math.ceil(d/60000))+" 分";if(d<DAY_MS)return"次の復習まで約 "+Math.ceil(d/3600000)+" 時間";return"次の復習まで約 "+Math.ceil(d/DAY_MS)+" 日"}
function loadNext(){renderStats();current=chooseNext();revealed=false;if(!current){$("studyArea").classList.add("hidden");$("emptyArea").classList.remove("hidden");$("notice").textContent=nextDueText();return}introduceIfNeeded(current);$("studyArea").classList.remove("hidden");$("emptyArea").classList.add("hidden");$("front").style.display="block";$("back").style.display="none";$("actions").classList.add("hidden");$("word").textContent=current.en;$("kana").textContent=current.kana;$("kana").style.display=settings.showKana?"block":"none";$("meaning").textContent=current.meaning;$("example").textContent=current.example;$("jp").textContent=current.jp;const s=getCS(current.id);$("meta").textContent=s.reps?`復習回数 ${s.reps}回・現在の間隔 ${s.interval||0}日`:"新しい単語";$("notice").textContent=`残り：復習 ${dueCards().length}語・新出 ${Math.min(remainingNewToday(),unseenCards().length)}語`;renderStats()}
function reveal(){if(!current||revealed)return;revealed=true;$("front").style.display="none";$("back").style.display="block";$("actions").classList.remove("hidden")}
function rate(kind){if(!current||!revealed)return;const s=getCS(current.id),now=Date.now();s.last=now;s.reps+=1;s.lastRating=kind;if(kind==="again"){s.lapses+=1;s.step=-1;s.interval=0;s.due=now+TEN_MIN_MS}else if(kind==="hard"){if(s.step<0){s.step=0;s.interval=1}else{s.interval=Math.max(1,Math.round((s.interval||1)*1.5));const cap=INTERVALS[Math.min(s.step+1,INTERVALS.length-1)];s.interval=Math.min(s.interval,cap)}s.due=now+s.interval*DAY_MS}else{s.step=Math.min(s.step+1,INTERVALS.length-1);if(s.step<0)s.step=0;s.interval=INTERVALS[s.step];s.due=now+s.interval*DAY_MS}saveState();loadNext()}
function speakCurrent(){if(!current||!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.en);u.lang="en-US";u.rate=.85;window.speechSynthesis.speak(u)}
function toggleKana(){settings.showKana=!settings.showKana;saveSettings();$("kanaToggle").textContent="カタカナ："+(settings.showKana?"表示":"非表示");if(current&&!revealed)$("kana").style.display=settings.showKana?"block":"none"}
function exportData(){const p={version:1,exportedAt:new Date().toISOString(),state,settings},b=new Blob([JSON.stringify(p,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="国家一般職_英文コア96_学習データ_"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.state||!p.settings)throw 0;state=p.state;settings=p.settings;saveState();saveSettings();$("dailyNew").value=settings.dailyNew;$("kanaToggle").textContent="カタカナ："+(settings.showKana?"表示":"非表示");loadNext();alert("学習データを読み込みました。") }catch(e){alert("読み込みに失敗しました。")}};r.readAsText(file)}
function resetAll(){if(!confirm("学習履歴をすべて削除します。よろしいですか？"))return;localStorage.removeItem(STORAGE_KEY);state={cards:{},daily:{}};forceQueue=[];loadNext()}
function forceReview(){forceQueue=CARDS.filter(c=>getCS(c.id).seen).sort((a,b)=>{const A=getCS(a.id),B=getCS(b.id);return(A.interval-B.interval)||(A.last-B.last)}).slice(0,10);loadNext()}
$("card").addEventListener("click",reveal);$("againBtn").addEventListener("click",()=>rate("again"));$("hardBtn").addEventListener("click",()=>rate("hard"));$("goodBtn").addEventListener("click",()=>rate("good"));$("speakBtn").addEventListener("click",speakCurrent);$("kanaToggle").addEventListener("click",toggleKana);$("exportBtn").addEventListener("click",exportData);$("importBtn").addEventListener("click",()=>$("importFile").click());$("importFile").addEventListener("change",e=>{if(e.target.files&&e.target.files[0])importData(e.target.files[0]);e.target.value=""});$("resetBtn").addEventListener("click",resetAll);$("showAllDueBtn").addEventListener("click",forceReview);$("dailyNew").value=settings.dailyNew;$("dailyNew").addEventListener("change",e=>{settings.dailyNew=Math.max(0,Math.min(30,parseInt(e.target.value||"10",10)));e.target.value=settings.dailyNew;saveSettings();loadNext()});$("kanaToggle").textContent="カタカナ："+(settings.showKana?"表示":"非表示");loadNext();
</script></body></html>
